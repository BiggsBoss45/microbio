<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GENESIS BIOSYSTEMS</title>

<style>
body{
    margin:0;
    background:black;
    color:#00ffcc;
    font-family:monospace;
    overflow-x:hidden;
    overflow-y:auto;
}

/* =========================
   BOOT SCREEN
========================= */
#boot{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:black;
}

#enterBtn{
    margin-top:20px;
    padding:12px 24px;
    background:black;
    color:#00ffcc;
    border:1px solid #00ffcc;
    cursor:pointer;
}

#enterBtn:hover{
    background:#00ffcc;
    color:black;
}

/* =========================
   MENU
========================= */
#menu{
    display:none;
    min-height:100vh;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    gap:20px;
}

/* =========================
   PAGES
========================= */
.page{
    display:none;
    padding:30px;
    max-width:1000px;
    margin:auto;
}

/* buttons */
.menuBtn{
    width:280px;
    padding:12px;
    background:black;
    color:#00ffcc;
    border:1px solid #00ffcc;
    cursor:pointer;
}

/* inputs */
input, select{
    background:black;
    color:#00ffcc;
    border:1px solid #00ffcc;
    padding:8px;
    width:280px;
    font-family:monospace;
}

#classificationResult{
    margin-top:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<!-- BOOT -->
<div id="boot">
    <h1>GENESIS BIOSYSTEMS</h1>
    <p>Containment Network v4.0</p>
    <button id="enterBtn">PRESS ENTER</button>
</div>

<!-- MENU -->
<div id="menu">
    <h2>MAIN MENU</h2>

    <button class="menuBtn" onclick="openPage('gram')">GRAM STAINING</button>
    <button class="menuBtn" onclick="openPage('morph')">MORPHOLOGY</button>
    <button class="menuBtn" onclick="openPage('classification')">CLASSIFICATION</button>
</div>

<!-- GRAM -->
<div id="gram" class="page">
    <h2>GRAM STAINING</h2>

    <div>
        <p>Gram Positive</p>
        <img src="gram_positive.jpg">
    </div>

    <div>
        <p>Gram Negative</p>
        <img src="gram_negative.jpg">
    </div>

    <button class="menuBtn" onclick="backToMenu()">RETURN</button>
</div>

<!-- MORPH -->
<div id="morph" class="page">
    <h2>MORPHOLOGY</h2>

    <div>
        <p>Bacillus</p>
        <img src="bacillus.jpg">
    </div>

    <div>
        <p>Cocci</p>
        <img src="cocci.jpg">
    </div>

    <div>
        <p>Spiral</p>
        <img src="spiral.jpg">
    </div>

    <button class="menuBtn" onclick="backToMenu()">RETURN</button>
</div>

<!-- CLASSIFICATION -->
<div id="classification" class="page">
    <h2>SAMPLE CLASSIFICATION</h2>

    <p>Gram Stain</p>
    <select id="gramInput">
        <option value="">Select...</option>
        <option value="positive">Positive</option>
        <option value="negative">Negative</option>
    </select>

    <p>Morphology</p>
    <select id="morphInput">
        <option value="">Select...</option>
        <option value="bacillus">Bacillus</option>
        <option value="cocci">Cocci</option>
        <option value="spiral">Spiral</option>
    </select>

    <br><br>

    <button class="menuBtn" onclick="verifyClassification()">VERIFY</button>

    <p id="classificationResult"></p>

    <button class="menuBtn" onclick="backToMenu()">RETURN</button>
</div>

<script>

/* =========================
BOOT
========================= */

const boot = document.getElementById("boot");
const menu = document.getElementById("menu");

document.getElementById("enterBtn").addEventListener("click", () => {
    boot.style.display = "none";
    menu.style.display = "flex";
});

/* =========================
PAGE NAV
========================= */

function openPage(page){
    document.querySelectorAll(".page").forEach(p => p.style.display = "none");
    menu.style.display = "none";
    document.getElementById(page).style.display = "block";
}

function backToMenu(){
    document.querySelectorAll(".page").forEach(p => p.style.display = "none");
    menu.style.display = "flex";
}

/* =========================
DATABASE SAFETY CHECK
========================= */

if (typeof database === "undefined") {
    console.warn("DATABASE is not defined. Add your dataset before verification works.");
}

/* =========================
FIXED CLASSIFICATION LOGIC
========================= */

function verifyClassification() {

    const gramEl = document.getElementById("gramInput");
    const morphEl = document.getElementById("morphInput");
    const result = document.getElementById("classificationResult");

    if (!gramEl || !morphEl || !result) return;
    if (!Array.isArray(database)) {
        result.style.color = "#ff4444";
        result.innerHTML = "DATABASE ERROR";
        return;
    }

    const gram = gramEl.value.trim().toLowerCase();
    const morph = morphEl.value.trim().toLowerCase();

    const matches = database.filter(entry => {
        if (!entry) return false;

        const entryGram = (entry.gram || "").toLowerCase().replace(/\s/g, "");
        const entryMorph = (entry.morphology || "").toLowerCase().replace(/\s/g, "");

        return (
            entryGram === gram.replace(/\s/g, "") &&
            entryMorph === morph.replace(/\s/g, "") &&
            entry.unlocked
        );
    });

    if (matches.length === 0) {
        result.style.color = "#ff4444";
        result.innerHTML = "CLASSIFICATION ERROR";
        return;
    }

    const selected = matches.find(e => e.role === "primary_pathogen") || matches[0];

    result.style.color = "#00ff66";
    result.innerHTML = "MATCH FOUND: " + selected.name;

    setTimeout(() => {
        openPage("investigationMenu");
    }, 1000);
}

</script>

</body>
</html>
